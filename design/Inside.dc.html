<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שני צדדים לכל קלף</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/livingbetter/tokens.css">
<link rel="stylesheet" href="base.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&amp;family=Frank+Ruhl+Libre:wght@300;400;500;700&amp;family=Gveret+Levin&amp;display=swap">
<style>
body{margin:0}
.inside{background-color:#f1ebde;background-image:url(/_blob/f9de67bc7ddc4698ac86636f6245888b),linear-gradient(180deg,#f1ebde 0%,#f1ebde 70%,#f9f4ea 100%);background-size:320px 320px,100% 100%;padding-block:32px 100px}
.in-sides{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);column-gap:64px;align-items:center}
/* wide screens: the text and the cards sit closer to the middle, like the opening */
@media (min-width: 1120px){ .in-sides{grid-template-columns:minmax(0,440px) minmax(0,520px);justify-content:center;column-gap:80px} }
.in-copy .in-title{margin-top:0;font-size:var(--fs-s2);line-height:1.2}
.in-copy .lb-lead{margin-top:20px;max-width:38ch}
.in-cap{margin-top:26px;display:flex;align-items:center;gap:12px;font-size:var(--fs-t3);line-height:1.5;color:var(--ink-muted,#6f6048)}
.in-cap-dot{flex:none;width:10px;height:10px;border-radius:50%;background:#d6aa3c;box-shadow:0 0 0 3px rgba(214,170,60,.22)}
/* the pair of real print files */
.in-pair{position:relative;margin:0;perspective:1600px}
.in-pair-grid{display:grid;grid-template-columns:repeat(2,minmax(0,240px));justify-content:center;column-gap:36px;row-gap:18px;align-items:start}
.in-card{position:relative;border-radius:16px;transition:transform .9s var(--ease-out),box-shadow .9s var(--ease-out),opacity .8s var(--ease-soft)}
.in-card img{width:100%;height:auto;border-radius:16px}
.in-card::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);pointer-events:none}
.in-face{transform:rotate(-3deg);box-shadow:0 40px 70px -40px rgba(55,40,6,.65),0 8px 18px -10px rgba(55,40,6,.3)}
.in-text{transform:rotate(2.5deg) translateY(26px);box-shadow:0 40px 70px -40px rgba(55,40,6,.6),0 8px 18px -10px rgba(55,40,6,.25);transition-delay:.25s}
.in-pair:hover .in-face{transform:rotate(-1deg) translateY(-6px)}
.in-pair:hover .in-text{transform:rotate(1deg) translateY(18px);transition-delay:0s}
.lb[data-motion="on"] [data-in="0"] .in-face{transform:rotate(0deg) translateX(-138px) scale(.96);transition:none}
.lb[data-motion="on"] [data-in="0"] .in-text{transform:translateX(138px) rotateY(-110deg);opacity:0;transition:none}
.in-label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--fs-u3);font-weight:600;letter-spacing:.2em;color:var(--ink-soft,#634d31)}
.in-label b{font-family:inherit;font-weight:700;font-size:inherit;letter-spacing:inherit;color:var(--gold-deep,#7a5a0e)}
.in-label-2{margin-top:26px}
@media (max-width: 860px){
  .inside{padding-block:24px 76px}
  .in-sides{grid-template-columns:minmax(0,1fr) !important;row-gap:40px}
  .in-copy{text-align:center}
  .in-copy .lb-lead{margin-inline:auto}
  .in-cap{justify-content:center;text-align:right}
  .in-pair-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}
  .in-text{transform:rotate(2deg) translateY(16px)}
  .lb[data-motion="on"] [data-in="0"] .in-face{transform:translateX(-50%) scale(.96)}
  .lb[data-motion="on"] [data-in="0"] .in-text{transform:translateX(50%) rotateY(-110deg)}
  .in-label{gap:5px}
  .in-label-2{margin-top:16px}
}
/* where the cards are narrow, each label goes on two lines: the side, then what is on it */
@media (min-width: 861px) and (max-width: 1119px), (max-width: 560px){
  .in-label{flex-direction:column;gap:2px}
  .in-label-dot{display:none}
}
</style>
</helmet>
<section class="lb lb-sec inside" id="inside" data-nav="kit" dir="rtl" data-motion="{{ motion }}" aria-labelledby="inside-title" ref="{{ setRoot }}" style="width: {{ rootW }}; height: {{ rootH }};">
<div class="lb-wrap">
<div class="in-sides">
<div class="in-copy" data-blk="c" data-in="{{ inC }}">
<h2 id="inside-title" class="lb-h2 in-title lb-rv lb-d1">שני צדדים לכל קלף</h2>
<p class="lb-lead lb-rv lb-d2">בצידו האחד של כל קלף מוצגת פרקטיקה לחיים טובים יותר ובצידו השני פירוט והרחבה על מהותה ושאלות להעמקת מודעות, לחקירה פנימית ולהנעה לפעולה.</p>
<p class="in-cap lb-rv lb-d3"><span class="in-cap-dot" aria-hidden="true"></span>בתמונה: קלף 54, ״להיענות לאחרים ללא ריצוי״, מהשער מערכות יחסים</p>
</div>
<figure class="in-pair" data-blk="p" data-in="{{ inP }}">
<div class="in-pair-grid">
<div class="in-card in-face"><img src="/_blob/965a31d711516e4ee3ddc6c0934810fa" alt="הצד הקדמי של הקלף: הכותרת ״להיענות לאחרים ללא ריצוי״ בכתב יד, איור של שתי ציפורים על ענף, מספר הקלף ושם השער" width="760" height="1064"></div>
<div class="in-card in-text"><img src="/_blob/7890307439bc875091eb2f331ee2dbbc" alt="הצד האחורי של הקלף: פסקת הרחבה על הפרקטיקה ושלוש שאלות להתבוננות" width="760" height="1064"></div>
<p class="in-label"><b>הצד הקדמי</b><span class="in-label-dot" aria-hidden="true">·</span><span>פרקטיקה</span></p>
<p class="in-label in-label-2"><b>הצד האחורי</b><span class="in-label-dot" aria-hidden="true">·</span><span>הרחבה ושאלות</span></p>
</div>
</figure>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fluid":{"editor":null,"default":false},"$preview":{"width":1440,"height":537}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { motion: 'off', inb: {} };
    this.setRoot = (el) => { this.root = el; };
  }
  componentDidMount() {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) return;
    this.setState({ motion: 'on' });
    this.io = new IntersectionObserver((entries) => {
      const add = {};
      entries.forEach((e) => { if (e.isIntersecting) { add[e.target.getAttribute('data-blk')] = '1'; this.io.unobserve(e.target); } });
      if (Object.keys(add).length) this.setState((s) => ({ inb: Object.assign({}, s.inb, add) }));
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.14 });
    requestAnimationFrame(() => { if (this.root) this.root.querySelectorAll('[data-blk]').forEach((el) => this.io.observe(el)); });
    this.fallback = setTimeout(() => {
      if (!this.root) return;
      const add = {};
      this.root.querySelectorAll('[data-blk]').forEach((el) => { const r = el.getBoundingClientRect(); if (r.top < window.innerHeight && r.bottom > 0) add[el.getAttribute('data-blk')] = '1'; });
      if (Object.keys(add).length) this.setState((s) => ({ inb: Object.assign({}, s.inb, add) }));
    }, 2500);
  }
  componentWillUnmount() { if (this.io) this.io.disconnect(); clearTimeout(this.fallback); }
  renderVals() {
    const fluid = !!this.props.fluid;
    const b = this.state.inb;
    return {
      motion: this.state.motion,
      inC: b.c || '0', inP: b.p || '0',
      rootW: fluid ? '100%' : '1440px',
      rootH: fluid ? 'auto' : '537px',
      setRoot: this.setRoot
    };
  }
}
</script>
</body>
</html>
