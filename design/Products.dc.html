<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מוצרים נלווים</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/livingbetter/tokens.css">
<link rel="stylesheet" href="base.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&amp;family=Frank+Ruhl+Libre:wght@300;400;500;700&amp;family=Gveret+Levin&amp;display=swap">
<style>
body{margin:0}
.pr{background-color:#f9f4ea;background-image:url(/_blob/f9de67bc7ddc4698ac86636f6245888b);background-size:320px 320px;padding-block:120px 92px}
.pr-head{text-align:center;max-width:760px;margin-inline:auto}
.pr-head .lb-eyebrow{justify-content:center}
.pr-head .lb-h2{margin-top:12px}
.pr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;max-width:1040px;margin:56px auto 0}
.pr-card{position:relative;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:stretch;border-radius:28px;overflow:hidden;background:#fffdf8;border:1px solid rgba(55,40,6,.08);box-shadow:0 34px 64px -48px rgba(55,40,6,.6);transition:transform .8s var(--ease-out),box-shadow .8s var(--ease-out)}
.pr-card:hover{transform:translateY(-6px);box-shadow:0 44px 80px -48px rgba(55,40,6,.65)}
.pr-fig{position:relative;margin:0;min-height:330px;overflow:hidden;background:#e9e1cf}
.pr-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 1.8s var(--ease-out)}
.pr-card:hover .pr-fig img{transform:scale(1.08)}
.pr-body{display:flex;flex-direction:column;padding:32px 30px 30px}
.pr-kicker{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--gold-deep,#7a5a0e)}
.pr-body h3{margin-top:8px;font-size:32px;line-height:1.15}
.pr-body p{margin-top:12px;font-size:18.5px;line-height:1.75;color:var(--ink-soft,#634d31)}
.pr-link{margin-top:auto;padding-top:20px;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:16px;font-weight:700;color:var(--gold-deep,#7a5a0e);text-decoration:none;min-height:44px}
.pr-link svg{width:18px;height:18px;transition:transform .4s var(--ease-out)}
.pr-link:hover svg{transform:translateY(3px)}
.pr-link:hover{color:var(--ink,#372806)}
@media (max-width: 960px){
  .pr{padding-block:84px 76px}
  .pr-grid{grid-template-columns:minmax(0,1fr) !important;gap:20px;margin-top:36px;max-width:520px}
}
@media (max-width: 480px){
  .pr-card{grid-template-columns:minmax(0,1fr) !important}
  .pr-fig{min-height:0;aspect-ratio:4/3}
  .pr-body{padding:24px 22px 22px}
  .pr-body h3{font-size:28px}
}
</style>
</helmet>
<section class="lb lb-sec pr" id="products" data-nav="pricing" dir="rtl" data-motion="{{ motion }}" aria-labelledby="pr-title" ref="{{ setRoot }}" style="width: {{ rootW }}; height: {{ rootH }};">
<div class="lb-wrap">
<header class="pr-head" data-blk="h" data-in="{{ inH }}">
<p class="lb-eyebrow lb-rv">להמשיך את המסע</p>
<h2 id="pr-title" class="lb-h2 lb-rv lb-d1">מוצרים נלווים</h2>
</header>
<div class="pr-grid" data-blk="g" data-in="{{ inG }}">
<article class="pr-card lb-rv">
<figure class="pr-fig"><img src="/_blob/878b23959a4b0c29e4c61eb4e1a335df" alt="מחברות ספירלה עם הלוגו ״זה בידיים שלך״ והכיתוב ״יומן מסע אישי״, על שולחן עץ" width="541" height="630" style="object-position: 45% 50%;"></figure>
<div class="pr-body">
<p class="pr-kicker">מחברת</p>
<h3>יומן מסע אישי</h3>
<p>לתיעוד התהליך, רעיונות, שאלות, מחשבות ורגשות.</p>
<a class="pr-link" href="#pricing">למחיר ולהזמנה<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg></a>
</div>
</article>
<article class="pr-card lb-rv lb-d2">
<figure class="pr-fig"><img src="/_blob/33ab2167a4a19e79fe0a1013363569a8" alt="תיק בד בהיר עם הלוגו ״זה בידיים שלך״ והכיתוב ״תיק משא אישי, רק למה שנחוץ״" width="404" height="630" style="object-position: 50% 62%;"></figure>
<div class="pr-body">
<p class="pr-kicker">תיק בד</p>
<h3>תיק משא אישי</h3>
<p>רק למה שנחוץ.</p>
<a class="pr-link" href="#pricing">למחיר ולהזמנה<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg></a>
</div>
</article>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fluid":{"editor":null,"default":false},"$preview":{"width":1440,"height":706}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { motion: 'off', inb: {} };
    this.setRoot = (el) => { this.root = el; };
  }
  componentDidMount() {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) return;
    this.setState({ motion: 'on' });
    this.io = new IntersectionObserver((entries) => {
      const add = {};
      entries.forEach((e) => { if (e.isIntersecting) { add[e.target.getAttribute('data-blk')] = '1'; this.io.unobserve(e.target); } });
      if (Object.keys(add).length) this.setState((s) => ({ inb: Object.assign({}, s.inb, add) }));
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.12 });
    requestAnimationFrame(() => { if (this.root) this.root.querySelectorAll('[data-blk]').forEach((el) => this.io.observe(el)); });
    this.fallback = setTimeout(() => {
      if (!this.root) return;
      const add = {};
      this.root.querySelectorAll('[data-blk]').forEach((el) => { const r = el.getBoundingClientRect(); if (r.top < window.innerHeight && r.bottom > 0) add[el.getAttribute('data-blk')] = '1'; });
      if (Object.keys(add).length) this.setState((s) => ({ inb: Object.assign({}, s.inb, add) }));
    }, 2500);
  }
  componentWillUnmount() { if (this.io) this.io.disconnect(); clearTimeout(this.fallback); }
  renderVals() {
    const fluid = !!this.props.fluid;
    const b = this.state.inb;
    return {
      motion: this.state.motion,
      inH: b.h || '0', inG: b.g || '0',
      rootW: fluid ? '100%' : '1440px',
      rootH: fluid ? 'auto' : '706px',
      setRoot: this.setRoot
    };
  }
}
</script>
</body>
</html>
